# Dhruto communication platform — clamd configuration (Phase 8).
# Mounted over the official image's /etc/clamav/clamd.conf. Keep in sync with
# the API upload policy: the largest chat attachment is 20 MiB, so streams and
# files up to 25 MiB are scanned; anything larger is answered "size limit
# exceeded", which the API treats as an error verdict (never clean).

LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 10M
LogRotate yes

LocalSocket /tmp/clamd.sock
# TCP is required by the API adapter. Expose it ONLY on a private network
# (no published host port, no public load balancer). Do not set TCPAddr to
# 0.0.0.0: that drops IPv6 and breaks the image's healthcheck (`nc localhost`
# resolves to ::1) — verified in Phase 8. Isolation comes from the network.
TCPSocket 3310

User clamav

# Resource bounds.
MaxThreads 4
MaxQueue 50
StreamMaxLength 25M
MaxFileSize 25M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
ReadTimeout 60
CommandReadTimeout 30

# Reload new signatures (freshclam notifies clamd) without dropping scans.
ConcurrentDatabaseReload yes
SelfCheck 3600

# Detection options appropriate for user uploads.
AlertBrokenExecutables yes
AlertEncrypted no
DetectPUA no
