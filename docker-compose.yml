services:
  postgres:
    image: postgres:16-alpine
    container_name: dhruto-postgres
    restart: unless-stopped
    # Tune for the API pool (DB_POOL_MAX=20/instance): 100 connections leaves
    # headroom for 4 API instances + workers + admin psql.
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dhruto
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dhruto"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: dhruto-redis
    restart: unless-stopped
    # AOF persistence: cache loss is tolerable (fail-open), but queue jobs
    # must survive a Redis restart — AOF every second bounds that loss.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
