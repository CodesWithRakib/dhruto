<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" fill="none">
  <defs>
    <!-- Background Emblem Gradient -->
    <linearGradient id="dhrutoEmblemGradInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Supersonic Speed Wing Gradient -->
    <linearGradient id="dhrutoWingGradInv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Velocity Lightning Gradient -->
    <linearGradient id="dhrutoVoltGradInv" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Golden Delivery Amber Accent -->
    <linearGradient id="dhrutoAmberGradInv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wordmark Gradient Accent -->
    <linearGradient id="dhrutoTextGradInv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- 1. Brand Mark Emblem -->
  <g transform="translate(16, 20)">
    <!-- Squircle Container with Neon Accent -->
    <rect width="120" height="120" rx="34" fill="url(#dhrutoEmblemGradInv)"/>
    <rect x="2" y="2" width="116" height="116" rx="32" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5"/>

    <!-- Speed Trails -->
    <path d="M22 68 H42 M16 78 H36 M26 88 H48" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round"/>

    <!-- Outer Speed Wing Swoosh -->
    <path d="M42 26 C68 26, 98 42, 102 62 C106 82, 84 96, 56 96 C48 96, 42 94, 38 90 L48 78 C52 80, 56 81, 60 81 C76 81, 88 72, 86 61 C84 50, 68 41, 48 41 L36 41 L42 26 Z" fill="url(#dhrutoWingGradInv)"/>

    <!-- Inner Supersonic Lightning Trajectory -->
    <path d="M48 34 L78 58 L54 62 L68 88 L34 56 L54 52 Z" fill="url(#dhrutoVoltGradInv)"/>

    <!-- High-Velocity Parcel Diamond Core -->
    <polygon points="76,46 90,56 78,66 64,56" fill="url(#dhrutoAmberGradInv)"/>
    <circle cx="88" cy="38" r="4.5" fill="#38bdf8"/>
    <circle cx="88" cy="38" r="2" fill="#ffffff"/>
  </g>

  <!-- 2. Master Typography Lockup (White / Light Mode for Dark Backgrounds) -->
  <g transform="translate(160, 24)">
    <text x="0" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="950" letter-spacing="-2.2" fill="#ffffff">
      Dhruto<tspan fill="url(#dhrutoTextGradInv)" font-weight="900" letter-spacing="-1.5">Express</tspan>
    </text>

    <g transform="translate(4, 96)">
      <text x="0" y="16" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-size="24" font-weight="800" fill="#a78bfa">
        দ্রুত
      </text>
      <circle cx="56" cy="10" r="3" fill="#64748b"/>
      <text x="70" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#94a3b8">
        SMART LOGISTICS OPERATING SYSTEM
      </text>
    </g>
  </g>
</svg>
