<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" fill="none">
  <defs>
    <!-- Background Emblem Gradient -->
    <linearGradient id="dhrutoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>

    <!-- Supersonic Speed Wing Gradient -->
    <linearGradient id="dhrutoWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Velocity Lightning Gradient -->
    <linearGradient id="dhrutoVoltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Golden Delivery Amber Accent -->
    <linearGradient id="dhrutoAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wordmark Gradient Accent -->
    <linearGradient id="dhrutoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dhrutoEmblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Brand Mark Emblem (120x120 within 160 height) -->
  <g transform="translate(16, 20)">
    <!-- Squircle Container -->
    <rect width="120" height="120" rx="34" fill="url(#dhrutoEmblemGrad)" filter="url(#dhrutoEmblemShadow)"/>
    <rect x="2.5" y="2.5" width="115" height="115" rx="31.5" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5"/>

    <!-- Dynamic Speed Trails / Trajectory Grid Glow -->
    <path d="M22 68 H42 M16 78 H36 M26 88 H48" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>

    <!-- Outer Speed Wing Swoosh (Aerodynamic "D" silhouette) -->
    <path d="M42 26 C68 26, 98 42, 102 62 C106 82, 84 96, 56 96 C48 96, 42 94, 38 90 L48 78 C52 80, 56 81, 60 81 C76 81, 88 72, 86 61 C84 50, 68 41, 48 41 L36 41 L42 26 Z" fill="url(#dhrutoWingGrad)"/>

    <!-- Inner Supersonic Courier Arrow / Lightning Trajectory -->
    <path d="M48 34 L78 58 L54 62 L68 88 L34 56 L54 52 Z" fill="url(#dhrutoVoltGrad)"/>

    <!-- High-Velocity Parcel Diamond Core -->
    <polygon points="76,46 90,56 78,66 64,56" fill="url(#dhrutoAmberGrad)"/>
    <circle cx="88" cy="38" r="4.5" fill="#38bdf8"/>
    <circle cx="88" cy="38" r="2" fill="#ffffff"/>
  </g>

  <!-- 2. Master Typography Lockup -->
  <g transform="translate(160, 24)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="950" letter-spacing="-2.2" fill="#0f172a">
      Dhruto<tspan fill="url(#dhrutoTextGrad)" font-weight="900" letter-spacing="-1.5">Express</tspan>
    </text>

    <!-- Secondary Bengali Name & System Identity Pill -->
    <g transform="translate(4, 96)">
      <!-- Bengali Native Typography -->
      <text x="0" y="16" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-size="24" font-weight="800" fill="#6366f1">
        দ্রুত
      </text>

      <!-- Pill Divider Dot -->
      <circle cx="56" cy="10" r="3" fill="#cbd5e1"/>

      <!-- Operational Tagline -->
      <text x="70" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#64748b">
        SMART LOGISTICS OPERATING SYSTEM
      </text>
    </g>
  </g>
</svg>
