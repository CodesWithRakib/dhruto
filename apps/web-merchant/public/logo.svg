<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" fill="none">
  <defs>
    <!-- Luminous Emerald-Obsidian Emblem Gradient -->
    <linearGradient id="dhrutoEmblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Contrast Ring -->
    <linearGradient id="dhrutoRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Aerodynamic Speed Wing Gradient -->
    <linearGradient id="dhrutoWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Supersonic Lightning Bolt Gradient -->
    <linearGradient id="dhrutoVoltGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Golden Parcel Core -->
    <linearGradient id="dhrutoAmberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Wordmark Gradient Accent (Light Mode) -->
    <linearGradient id="dhrutoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="dhrutoEmblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 1. Brand Mark Emblem (120x120) -->
  <g transform="translate(6, 6)">
    <!-- Squircle Container -->
    <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#dhrutoEmblemGrad)" filter="url(#dhrutoEmblemShadow)"/>
    <rect x="5.5" y="5.5" width="109" height="109" rx="28.5" stroke="url(#dhrutoRingGrad)" stroke-width="2.5"/>

    <!-- Dynamic Speed Trails -->
    <path d="M18 72 H38 M14 80 H34 M20 88 H42" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- Outer Speed Wing (Aerodynamic stylized D curve) -->
    <path d="M42 24 C68 24, 98 40, 102 60 C106 80, 84 96, 56 96 C48 96, 42 94, 38 90 L48 78 C52 80, 56 81, 60 81 C76 81, 88 72, 86 61 C84 50, 68 41, 48 41 L36 41 L42 24 Z" fill="url(#dhrutoWingGrad)"/>

    <!-- Inner Supersonic Courier Arrow -->
    <path d="M48 32 L80 58 L56 62 L70 90 L34 56 L54 52 Z" fill="url(#dhrutoVoltGrad)"/>

    <!-- Parcel Diamond Core -->
    <polygon points="76,46 90,56 78,66 64,56" fill="url(#dhrutoAmberGrad)"/>
    <polygon points="76,46 64,56 78,66" fill="#f59e0b" fill-opacity="0.75"/>
    <circle cx="88" cy="38" r="4.5" fill="#38bdf8"/>
    <circle cx="88" cy="38" r="2" fill="#ffffff"/>
  </g>

  <!-- 2. Master Typography Lockup (Light Mode: Deep High-Contrast Text) -->
  <g transform="translate(150, 10)">
    <!-- Primary Wordmark -->
    <text x="0" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="950" letter-spacing="-2" fill="#0f172a">
      Dhruto<tspan dx="3" fill="url(#dhrutoTextGrad)" font-weight="900" letter-spacing="-1.2">Express</tspan>
    </text>

    <!-- Sub-row: Bengali Name + Tagline -->
    <g transform="translate(2, 94)">
      <text x="0" y="0" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-size="22" font-weight="800" fill="#059669">
        দ্রুত
      </text>
      <circle cx="52" cy="-7" r="3" fill="#cbd5e1"/>
      <text x="66" y="-2" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="#64748b">
        SMART LOGISTICS OPERATING SYSTEM
      </text>
    </g>
  </g>
</svg>
